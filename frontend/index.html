<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relative path on purpose. Vite rewrites relative asset URLs in this file, so the build
         emits /assets/favicon-<contenthash>.png and points this href at it; an absolute /images/...
         path would be treated as a public/ file and passed through untouched. The hash is what
         makes replacing the icon safe: /assets/** is served immutable for a year and Cloudflare
         caches it at the edge, but new bytes produce a new filename, so there is nothing stale to
         invalidate. Drop a new frontend/src/assets/favicon.png and rebuild - no version to bump.
         The dev server serves this same path straight from disk. -->
    <link rel="icon" type="image/png" href="./src/assets/favicon.png" />
    <title>Thoth</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
