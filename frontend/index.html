<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lives in frontend/public/, so the path is identical in both environments: the dev server
         serves public/ at the root, and `vite build` copies it verbatim into dist/, which Spring
         serves from disk (application.yml -> spring.web.resources.static-locations).

         ?v= is the cache buster, and it is not optional. Files under /images/ are served with
         max-age=86400 and Cloudflare caches them at the edge, so replacing favicon.png without
         changing the URL keeps the old icon live for up to a day - a browser hard-refresh does
         not help, because it still hits the edge. Bump this to the first 8 hex of the new file's
         SHA-256 whenever the image is replaced. -->
    <link rel="icon" type="image/png" href="/images/favicon.png?v=e0bdaaca" />
    <title>병아리 경제 뉴스</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
