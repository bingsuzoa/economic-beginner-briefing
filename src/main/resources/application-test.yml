briefing:
  dry-run: true
  scheduler:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
auth:
  require-https: false
  email-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  email-hash-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

server:
  servlet:
    session:
      cookie:
        secure: false

admin:
  token: test-admin-token
  default-page-size: 20

exchange-rate:
  fixer:
    scheduler-enabled: false
  ecos:
    scheduler-enabled: false
