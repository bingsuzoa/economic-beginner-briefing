spring:
  application:
    name: economic-briefing

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/economic_briefing?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    # 엔티티에 지연 로딩 연관관계가 없어 뷰 렌더링 중 세션이 필요하지 않습니다.
    # 켜두면 응답을 쓰는 동안 커넥션을 계속 붙잡고, 기본값 경고도 매 부팅 출력됩니다.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # 빌드된 프론트엔드를 같은 프로세스에서 서빙합니다. 별도 정적 서버가 필요 없어
  # 상시 구동해야 할 프로세스가 하나로 줄어듭니다.
  # 프론트를 수정했다면: cd frontend && npm run build
  web:
    resources:
      static-locations: "classpath:/static/,file:${FRONTEND_DIST:C:/economic-beginner-briefing/frontend/dist}/"

server:
  port: ${ADMIN_PORT:3000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${AUTH_SECURE_COOKIE:true}
        http-only: true
      timeout: 7d

briefing:
  # false = real RSS + real OpenAI. When true, every external call is mocked.
  dry-run: ${DRY_RUN:false}

  timeouts:
    rss-http: 10s
    ai-api: 60s

  retry:
    # 3 attempts: a TPM-limit 429 needs the rate window to roll over, one retry is not enough
    max-attempts: 3
    initial-delay: 1s
    next-delay: 2s

  diversity:
    max-articles-per-source: 3
    max-articles-per-category: 3
    min-personal-finance-relevance: 3
    soft-max-override-score: 5

  audience:
    economic-knowledge-level: beginner
    interests:
      - interest_rate
      - loan
      - housing
      - jeonse_monthly_rent
      - deposit_saving
      - government_support
    context-notes:
      - "\uC2E0\uD63C\uBD80\uBD80"
      - "\uC8FC\uD0DD \uAD6C\uC785\uACFC \uCD9C\uC0B0 \uC900\uBE44"
      - "\uACBD\uC81C\uC6A9\uC5B4 \uC124\uBA85 \uD544\uC694"

  cli:
    enabled: ${BRIEFING_CLI_ENABLED:false}

  scheduler:
    # On by default: this file is the operating configuration, no profile required.
    # Set SCHEDULER_ENABLED=false to run without the hourly trigger (tests, one-shot CLI).
    enabled: ${SCHEDULER_ENABLED:true}
    # 6 fields (sec min hour day month weekday). Evaluated in Asia/Seoul.
    cron: ${SCHEDULER_CRON:0 0 * * * *}

  health:
    # GET /api/health/briefing reports DOWN past this age. Hourly cron, so this tolerates
    # two missed ticks before paging. Only enforced while the scheduler is enabled.
    max-success-age: ${HEALTH_MAX_SUCCESS_AGE:3h}

  teacher:
    enabled: ${TEACHER_ENABLED:false}
    prompt-version: "teacher-v1"
    # Cheap model on purpose: one call per article, so this stage would otherwise drain
    # the main model's tokens-per-minute budget before the analysis call runs.
    model: ${TEACHER_MODEL:gpt-4o-mini}
    concurrency: ${TEACHER_CONCURRENCY:6}

  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    model: text-embedding-3-small
    dimensions: 1536

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o}
  temperature: 0.3
  timeout: 60s
  max-selected-news: 15
  economic-flow-comparison-model: ${ECONOMIC_FLOW_COMPARISON_MODEL:gpt-4o-mini}
  economic-flow-traversal-model: ${ECONOMIC_FLOW_TRAVERSAL_MODEL:gpt-4o-mini}
  rate-limit:
    # The account permits 30,000 TPM for gpt-4o. Reserve headroom for token-estimation error
    # and other account activity, then pace every model independently in a rolling minute.
    safe-tokens-per-minute: ${OPENAI_SAFE_TOKENS_PER_MINUTE:24000}
    window: 60s

auth:
  require-https: ${AUTH_REQUIRE_HTTPS:true}
  email-encryption-key: ${AUTH_EMAIL_ENCRYPTION_KEY}
  email-hash-key: ${AUTH_EMAIL_HASH_KEY}

admin:
  # No default: a blank token is rejected at startup and by the admin filter.
  token: ${ADMIN_TOKEN:}
  default-page-size: 20

exchange-rate:
  fixer:
    api-key: ${FIXER_API_KEY:}
    api-url: http://data.fixer.io/api/latest
    timeout: 15s
    scheduler-enabled: ${EXCHANGE_RATE_SCHEDULER_ENABLED:true}
    scheduler-cron: ${FIXER_SCHEDULER_CRON:0 0 9,18 * * *}
  ecos:
    api-key: ${ECOS_API_KEY:}
    api-url: https://ecos.bok.or.kr/api
    timeout: 30s
    scheduler-enabled: ${EXCHANGE_RATE_SCHEDULER_ENABLED:true}
    # Daily series is available after the business-day fixing; seven-day lookback repairs gaps.
    scheduler-cron: ${ECOS_SCHEDULER_CRON:0 30 18 * * *}

logging:
  level:
    root: INFO
    com.economicbriefing: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
