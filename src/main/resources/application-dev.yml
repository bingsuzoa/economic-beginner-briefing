briefing:
  dry-run: false
  scheduler:
    enabled: true

spring:
  datasource:
    # Do not inherit SPRING_DATASOURCE_URL here: it may point to the production DB.
    url: ${DEV_DATASOURCE_URL:jdbc:postgresql://localhost:5432/economic_briefing_dev?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

auth:
  require-https: false
  allowed-origin: ${AUTH_ALLOWED_ORIGIN:https://economic-beginner.onrender.com}

server:
  port: ${DEV_SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${AUTH_SECURE_COOKIE:true}

logging:
  level:
    com.economicbriefing: DEBUG
