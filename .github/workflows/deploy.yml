name: Deploy Economic Briefing

# push to main only. Do NOT add pull_request: this repository is public and the job runs on a
# self-hosted runner as SYSTEM, so a fork's PR would execute arbitrary code on the home desktop.
on:
  push:
    branches: [main]

# One deploy at a time. Two concurrent runs would fight over the service and the JAR file.
# cancel-in-progress stays false: killing a deploy midway leaves the service stopped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, economic-briefing]
    timeout-minutes: 30
    defaults:
      run:
        # Not the built-in `shell: powershell`. That one runs `powershell -command ". '<step>.ps1'"`
        # with no -ExecutionPolicy flag, and this runner is a service running as SYSTEM: SYSTEM has
        # no CurrentUser policy and LocalMachine is Undefined, so its effective policy is Restricted
        # and every step dies in under a second with "running scripts is disabled on this system".
        # Setting the machine-wide policy would fix it too; keeping it here keeps the workaround in
        # the repository instead of in undocumented machine state.
        # A custom shell string skips the built-in template, so the two things that template adds -
        # stop-on-error and exit-code propagation - have to be spelled out.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; . '{0}'; exit $LASTEXITCODE"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A UI-only commit once swapped the live fetch for a bundled mockData.js and left the real
      # call commented out. The pipeline deployed it exactly as told, and the public site served
      # fabricated briefings while the API was returning real ones. Cheap check, runs before the
      # build so it fails in seconds.
      - name: Guard against mock data in the frontend
        run: |
          $hits = Get-ChildItem frontend\src -Recurse -File -Include *.js,*.jsx |
                  Select-String -Pattern 'mockData|mockNews'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Mock data is referenced in frontend/src. Restore the real API call before deploying.'
          }
          Write-Host 'No mock data references in frontend/src.'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No actions/cache for Gradle on purpose. A self-hosted runner keeps ~/.gradle between
      # runs, so the dependency cache is already warm on disk; actions/cache would instead
      # push and pull hundreds of MB over a home uplink every run and count against the 10 GB
      # repo cache quota. If this ever moves to a GitHub-hosted runner, add
      # `cache: gradle` to the setup-java step above.

      - name: Test
        run: .\gradlew.bat test --console=plain

      # Builds the JAR and the frontend here in the workspace, then stops the service, copies
      # the artifacts into the production directory and restarts. Production's git tree is
      # never touched, so a deploy cannot disturb whatever branch is checked out there.
      # Rolls back to the previous JAR automatically if the new one fails its health check.
      - name: Deploy
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\deploy.ps1
          -ProdRoot "C:\economic-beginner-briefing"

      - name: Health check
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\health-check.ps1
          -TimeoutSec 120

      - name: Diagnostics on failure
        if: failure()
        run: |
          Get-Service EconomicBriefing, postgresql-x64-17, cloudflared | Format-Table Name, Status
          Write-Host '--- service-stdout.log (tail) ---'
          Get-Content C:\economic-beginner-briefing\logs\service-stdout.log -Tail 80 -ErrorAction SilentlyContinue
          Write-Host '--- service-stderr.log (tail) ---'
          Get-Content C:\economic-beginner-briefing\logs\service-stderr.log -Tail 40 -ErrorAction SilentlyContinue
